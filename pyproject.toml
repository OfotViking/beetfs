[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-beetfs"
version = "0.12.1"
authors = [
  { name="Drew Abbott", email="abbotta4@gmail.com" },
]
description = "A beets plugin for mounting a FUSE filesystem of audio items"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beets>=2.0",
    "mediafile",
    "pyfuse3",
    "trio",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/OfotViking/beetfs"
Issues = "https://github.com/OfotViking/beetfs/issues"
Upstream = "https://github.com/abbotta4/beetfs"

[tool.setuptools.packages.find]
# All the following settings are optional:
include = ["beetsplug"]
# beetsplug is a namespace package shared with beets and its other plugins,
# so it has no __init__.py; without this the wheel would contain no plugin
namespaces = true
